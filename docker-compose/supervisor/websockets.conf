[supervisord]
logfile=/var/www/storage/logs/supervisord.log
loglevel=info
nodaemon=true
stopasgroup=true
killasgroup=true
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr


[program:laravel-websockets]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/artisan websockets:serve --host=0.0.0.0 --port=6003
autostart=true
autorestart=true
user=laravel
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/websockets.log
stopwaitsecs=3600


[program:queue]
command=/usr/local/bin/php /var/www/artisan queue:work --tries=3
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue.log
user=laravel
directory=/var/www

