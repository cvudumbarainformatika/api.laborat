# version: '3'
services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        user: laravel
        uid: 1000
        gid: 1000
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "6003:6003" # Tambahkan ini untuk WebSocket
    volumes:
      - ./:/var/www
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
