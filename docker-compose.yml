# version: '3'
services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        user: laravel
        uid: 1000
        gid: 1000
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "6003:6003" # WebSocket
      - "8000:8000" # Swoole
    volumes:
      - ./:/var/www
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
